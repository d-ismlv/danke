<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b79f3"/>
      <stop offset="1" stop-color="#4a37b3"/>
    </linearGradient>
  </defs>
  <!-- Full bleed and square: iOS masks the corners itself, and any alpha left
       in the source is composited onto black. -->
  <rect width="180" height="180" fill="url(#bg)"/>
  <!-- The 32-unit mark, scaled to 66% and centred so the squircle mask has
       room to cut without clipping the cards. -->
  <g transform="translate(16.4,16.4) scale(4.6)">
    <rect x="3" y="7" width="9" height="18" rx="2.5" fill="#ffffff" opacity="0.34"/>
    <rect x="9" y="3" width="20" height="26" rx="2.5" fill="#ffffff"/>
    <path d="M19 9 20.77 14.23 26 16 20.77 17.77 19 23 17.23 17.77 12 16 17.23 14.23Z" fill="#5340c2"/>
  </g>
</svg>
